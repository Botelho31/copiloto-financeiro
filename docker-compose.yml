services:
  copiloto-financeiro:
    build: .
    container_name: copiloto-financeiro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Inside the container, 127.0.0.1 is the container's own loopback and
      # unreachable from outside it — bind wide open here instead, and rely on
      # the host-side "127.0.0.1:8080:" restriction above to keep this off the
      # LAN, same as the bare (non-Docker) default.
      - HOST=0.0.0.0
